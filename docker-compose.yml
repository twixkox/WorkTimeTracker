name: worktimetracker

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: "Data Source=/app/App_Data/worktime.db"
      Database__Provider: Sqlite
      SeedAdmin__Email: "${ADMIN_EMAIL:-admin@worktime.local}"
      SeedAdmin__Password: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      AllowedHosts: "${ALLOWED_HOSTS:-localhost}"
    volumes:
      - appdata:/app/App_Data

volumes:
  appdata:
